[package]
name = "vtag"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
git2 = { version = "0.21.0", default-features = false }
inquire = "0.9.1"
# Use the supported AWS-LC JWT provider instead of the vulnerable rsa crate.
# Preserve the remaining HTTP/TLS defaults and personal-token authentication.
octocrab = { version = "0.49.0", default-features = false, features = [
    "follow-redirect",
    "retry",
    "rustls",
    "timeout",
    "tracing",
    "default-client",
    "rustls-ring",
    "jwt-aws-lc-rs",
] }
once_cell = "1.21.3"
regex = "1.12.2"
semver = "1.0.27"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
