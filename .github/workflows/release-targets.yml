name: Release Target Builds

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - ".goreleaser.yaml"
      - ".github/workflows/release-targets.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - ".goreleaser.yaml"
      - ".github/workflows/release-targets.yml"

permissions:
  contents: read

jobs:
  cross-build:
    name: Build ${{ matrix.target }}
    # Match the release workflow's host and cross-compiler family without
    # invoking its signing, publishing, or repository-writing steps.
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      TARGET: ${{ matrix.target }}
      AWS_LC_SYS_PREBUILT_NASM: "1"
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
      CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: rust-lld
      CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: rust-lld
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.0"
          use-cache: false

      - name: Install MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          brew install mingw-w64
          x86_64-w64-mingw32-gcc --version

      - name: Install pinned Cargo cross-builder
        run: cargo install cargo-zigbuild --version 0.24.0 --locked

      - name: Exercise Windows prebuilt assembly fallback
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          # Simulate an unavailable NASM without changing the runner's install.
          # This verifies the same fallback enabled in .goreleaser.yaml.
          mkdir -p "$RUNNER_TEMP/no-nasm"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/no-nasm/nasm"
          chmod +x "$RUNNER_TEMP/no-nasm/nasm"
          echo "$RUNNER_TEMP/no-nasm" >> "$GITHUB_PATH"

      - name: Build release target without publishing
        run: |
          cargo zigbuild --locked --release --target "$TARGET"
          binary="target/$TARGET/release/vtag"
          if [[ "$TARGET" == *windows* ]]; then binary="$binary.exe"; fi
          test -s "$binary"
          file "$binary"
