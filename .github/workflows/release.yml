name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    uses: eeekcct/goreleaser-rust-workflow/.github/workflows/release.yml@681b4077c1a393f506b87ce729e0d576fcee5aef # NASM source-build support
    with:
      third_party_licenses: true
      license_check: true
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
